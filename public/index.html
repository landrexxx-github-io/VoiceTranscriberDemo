<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Record your microphone and transcribe speech in real time." />
    <title>Live Voice Transcription</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="recorder-card" aria-labelledby="page-title">
        <header class="card-header">
          <div>
            <h1 id="page-title">Real-Time Voice Transcription</h1>
            <p class="subtitle">Record from your microphone and watch your words appear in real time.</p>
          </div>

          <div class="status" id="status" data-state="idle" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText">Ready</span>
          </div>
        </header>

        <div class="meter-wrap" aria-hidden="true">
          <div class="meter-bars" id="meterBars"></div>
          <time id="timer">00:00</time>
        </div>

        <div class="controls">
          <button class="button button-primary" id="startButton" type="button">
            <span class="record-icon" aria-hidden="true"></span>
            Start recording
          </button>
          <button class="button button-danger" id="stopButton" type="button" disabled>
            <span class="stop-icon" aria-hidden="true"></span>
            Stop
          </button>
          <button class="button button-secondary" id="downloadButton" type="button" disabled>
            Download audio
          </button>
          <button class="button button-ghost" id="clearButton" type="button">Clear text</button>
        </div>

        <p class="error-message" id="errorMessage" role="alert" hidden></p>

        <section class="transcript-panel" aria-labelledby="transcript-heading">
          <div class="transcript-heading-row">
            <h2 id="transcript-heading">Transcript</h2>
            <span class="live-label" id="liveLabel" hidden>LIVE</span>
          </div>

          <div class="transcript" id="transcript" aria-live="polite" aria-atomic="false">
            <p class="placeholder" id="placeholder">Your transcription will appear here when you begin speaking.</p>
            <div id="finalTranscript"></div>
            <p class="partial" id="partialTranscript"></p>
          </div>
        </section>

        <p class="privacy-note">Your API key stays on the Node.js server and is never sent to the browser.</p>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
